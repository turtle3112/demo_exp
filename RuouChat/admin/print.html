<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hóa đơn - WINECELLAR.vn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #e9ecef;
            font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
            padding: 30px 20px;
        }
        .invoice-wrapper {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .invoice-container {
            padding: 30px 35px;
        }
        /* Header */
        .invoice-header {
            text-align: center;
            border-bottom: 3px solid #8B1E1E;
            padding-bottom: 20px;
            margin-bottom: 25px;
        }
        .invoice-header h1 {
            font-size: 28px;
            font-weight: 800;
            color: #8B1E1E;
            letter-spacing: 1px;
            margin: 0;
        }
        .invoice-header p {
            color: #6c757d;
            margin-top: 8px;
            font-size: 13px;
        }
        .invoice-title {
            font-size: 22px;
            font-weight: 700;
            text-align: center;
            background: #f8f9fa;
            display: inline-block;
            padding: 6px 25px;
            border-radius: 40px;
            margin: 0 auto 25px;
            letter-spacing: 1px;
            color: #8B1E1E;
            border: 1px solid #dee2e6;
        }
        /* Thông tin khách hàng & đơn hàng */
        .info-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            background: #fef9f4;
            padding: 18px 20px;
            border-radius: 16px;
            margin-bottom: 30px;
            border-left: 5px solid #8B1E1E;
        }
        .info-col {
            flex: 1;
            min-width: 200px;
        }
        .info-col p {
            margin-bottom: 8px;
            font-size: 14px;
        }
        .info-col strong {
            color: #2c3e50;
            width: 110px;
            display: inline-block;
        }
        /* Bảng sản phẩm */
        .product-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        .product-table th {
            background: #8B1E1E;
            color: white;
            padding: 12px 8px;
            font-weight: 600;
            font-size: 14px;
            text-align: center;
            border: 1px solid #a53131;
        }
        .product-table td {
            border: 1px solid #dee2e6;
            padding: 10px 8px;
            text-align: center;
            vertical-align: middle;
            font-size: 14px;
        }
        .product-table td:first-child, .product-table th:first-child { width: 50px; }
        .product-table td:nth-child(2) { text-align: left; }
        .total-row {
            background: #f8f9fa;
            font-weight: 800;
            font-size: 18px;
        }
        .total-row td {
            padding: 12px;
            border-top: 2px solid #8B1E1E;
        }
        .discount-note {
            background: #fff3e0;
            border-left: 4px solid #ff9800;
            padding: 10px 15px;
            margin: 15px 0;
            border-radius: 12px;
            font-size: 13px;
            color: #856404;
        }
        /* Footer */
        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px dashed #ced4da;
            font-size: 12px;
            color: #6c757d;
        }
        .footer p {
            margin: 5px 0;
        }
        .thankyou {
            font-size: 15px;
            font-weight: 500;
            color: #8B1E1E;
            margin-top: 10px;
        }
        /* Nút in */
        .action-buttons {
            text-align: center;
            margin-top: 25px;
            padding-bottom: 20px;
        }
        .btn-custom {
            background: #8B1E1E;
            border: none;
            padding: 10px 24px;
            font-weight: 600;
            border-radius: 40px;
            color: white;
            margin: 0 8px;
            transition: 0.2s;
        }
        .btn-custom:hover {
            background: #6b1717;
            transform: translateY(-2px);
        }
        .btn-outline-custom {
            background: white;
            border: 1px solid #8B1E1E;
            color: #8B1E1E;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
        }
        .btn-outline-custom:hover {
            background: #f8f9fa;
        }
        @media print {
            body {
                background: white;
                padding: 0;
                margin: 0;
            }
            .invoice-wrapper {
                box-shadow: none;
                border-radius: 0;
            }
            .action-buttons, .no-print {
                display: none;
            }
            .invoice-container {
                padding: 15px;
            }
            .product-table th {
                background: #8B1E1E !important;
                color: white !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .info-grid {
                background: #fef9f4 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
        .text-right {
            text-align: right;
        }
        .text-center {
            text-align: center;
        }
        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #8B1E1E;
        }
    </style>
</head>
<body>
<div class="invoice-wrapper">
    <div class="invoice-container" id="invoiceContainer">
        <div class="loading">
            <i class="fas fa-spinner fa-pulse fa-2x"></i>
            <p class="mt-2">Đang tải hóa đơn...</p>
        </div>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('id');

    if (!orderId) {
        document.getElementById('invoiceContainer').innerHTML = '<div class="error-message"><i class="fas fa-exclamation-triangle"></i> Không tìm thấy mã đơn hàng</div>';
    } else {
        fetch(`../api/admin_orders.php?id=${orderId}`, {
            credentials: 'include',
            headers: { 'Accept': 'application/json' }
        })
        .then(async res => {
            if (!res.ok) {
                let errorMsg = `Lỗi ${res.status}`;
                try {
                    const errData = await res.json();
                    errorMsg = errData.error || errorMsg;
                } catch(e) {}
                throw new Error(errorMsg);
            }
            return res.json();
        })
        .then(order => {
            renderInvoice(order);
        })
        .catch(err => {
            document.getElementById('invoiceContainer').innerHTML = `<div class="error-message"><i class="fas fa-times-circle"></i> Không thể tải hóa đơn: ${err.message}<br><small>Vui lòng kiểm tra quyền truy cập hoặc thử lại sau.</small></div>`;
        });
    }

    function renderInvoice(order) {
        // Trạng thái
        const statusMap = {
            'pending': 'Chờ xử lý',
            'processing': 'Đang xử lý',
            'completed': 'Hoàn thành',
            'cancelled': 'Đã hủy'
        };
        const statusText = statusMap[order.status] || order.status;
        const paymentText = order.payment_method === 'cod' ? 'Thanh toán khi nhận hàng (COD)' : 'Chuyển khoản ngân hàng';
        
        // Tổng tiền hàng
        let subtotal = 0;
        let itemsHtml = '';
        if (order.items && order.items.length) {
            order.items.forEach((item, idx) => {
                const itemTotal = item.price * item.quantity;
                subtotal += itemTotal;
                itemsHtml += `
                    <tr>
                        <td>${idx+1}</td>
                        <td style="text-align:left">${escapeHtml(item.name)}</td>
                        <td>${item.quantity}</td>
                        <td>${formatPrice(item.price)}</td>
                        <td>${formatPrice(itemTotal)}</td>
                    </tr>
                `;
            });
        } else {
            itemsHtml = `<tr><td colspan="5" class="text-center">Không có sản phẩm trong đơn hàng</td></tr>`;
        }

        // Xử lý giảm giá (nếu có promo)
        let discountAmount = 0;
        let finalTotal = subtotal;
        if (order.discount_amount && order.discount_amount > 0) {
            discountAmount = order.discount_amount;
            finalTotal = subtotal - discountAmount;
        } else if (order.promo_discount) {
            discountAmount = order.promo_discount;
            finalTotal = subtotal - discountAmount;
        }

        // Hiển thị thông tin khuyến mãi nếu có
        let promoHtml = '';
        if (discountAmount > 0) {
            promoHtml = `
                <div class="discount-note">
                    <i class="fas fa-tag"></i> <strong>Ưu đãi áp dụng:</strong> Giảm ${formatPrice(discountAmount)} 
                    ${order.promo_code ? `(Mã: ${escapeHtml(order.promo_code)})` : ''}
                </div>
            `;
        }

        const html = `
            <div class="invoice-header">
                <h1>WINECELLAR.vn</h1>
                <p>78 Vũ Phạm Hàm, Yên Hòa, Cầu Giấy, Hà Nội | Hotline: 094 669 8008</p>
            </div>
            <div class="text-center">
                <div class="invoice-title">HÓA ĐƠN BÁN HÀNG</div>
            </div>

            <div class="info-grid">
                <div class="info-col">
                    <p><strong>Mã đơn hàng:</strong> ${order.order_code || '#' + order.id}</p>
                    <p><strong>Ngày đặt:</strong> ${formatDate(order.created_at)}</p>
                </div>
                <div class="info-col">
                    <p><strong>Khách hàng:</strong> ${escapeHtml(order.fullname)}</p>
                    <p><strong>Email:</strong> ${escapeHtml(order.email)}</p>
                    <p><strong>Điện thoại:</strong> ${escapeHtml(order.phone)}</p>
                </div>
                <div class="info-col">
                    <p><strong>Địa chỉ giao hàng:</strong><br> ${escapeHtml(order.address).replace(/\n/g, '<br>')}</p>
                    <p><strong>Hình thức thanh toán:</strong> ${paymentText}</p>
                </div>
            </div>

            <table class="product-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Sản phẩm</th>
                        <th>Số lượng</th>
                        <th>Đơn giá</th>
                        <th>Thành tiền</th>
                    </tr>
                </thead>
                <tbody>
                    ${itemsHtml}
                </tbody>
                <tfoot>
                    <tr>
                        <td colspan="4" class="text-right"><strong>Tạm tính</strong></td>
                        <td><strong>${formatPrice(subtotal)}</strong></td>
                    </tr>
                    ${discountAmount > 0 ? `
                    <tr>
                        <td colspan="4" class="text-right">Giảm giá</td>
                        <td style="color:#dc3545">- ${formatPrice(discountAmount)}</td>
                    </tr>
                    ` : ''}
                    <tr class="total-row">
                        <td colspan="4" class="text-right"><strong>TỔNG CỘNG</strong></td>
                        <td><strong style="font-size:1.3rem; color:#8B1E1E;">${formatPrice(finalTotal)}</strong></td>
                    </tr>
                </tfoot>
            </table>

            ${promoHtml}

            <div class="footer">
                <p>Cảm ơn quý khách đã mua sắm tại WINECELLAR.vn</p>
                <p>Mọi thắc mắc xin liên hệ hotline: <strong>094 669 8008</strong> (miễn phí)</p>
                <p class="thankyou">Hẹn gặp lại quý khách!</p>
            </div>

            <div class="action-buttons no-print">
                <button class="btn-custom" onclick="window.print()"><i class="fas fa-print"></i> In hóa đơn</button>
                <button class="btn-outline-custom" onclick="window.close()"><i class="fas fa-times"></i> Đóng</button>
            </div>
        `;

        document.getElementById('invoiceContainer').innerHTML = html;
    }

    function formatPrice(price) {
        if (typeof price !== 'number') price = parseFloat(price);
        return new Intl.NumberFormat('vi-VN').format(price) + '₫';
    }

    function formatDate(dateStr) {
        if (!dateStr) return '';
        const date = new Date(dateStr);
        return date.toLocaleString('vi-VN', { hour12: false });
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
</script>
</body>
</html>
