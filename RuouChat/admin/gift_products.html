<!DOCTYPE html>

        /* ===== SIDEBAR (giống product_form) ===== */

            border-right: 1px solid rgba(255,255,255,0.05);
            overflow-y: auto;
            overflow-x: hidden;
            z-index: 1000;
            transition: transform 0.3s ease;
            padding: 0 4px;
        }
        .sidebar::-webkit-scrollbar { width: 5px; }
        .sidebar::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
        .sidebar::-webkit-scrollbar-thumb { background: #eab308; border-radius: 10px; }

        .sidebar .brand {
            font-size: 1.1rem;

            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #FFFFFF 0%, #e2e8f0 100%);

            text-shadow: 0 2px 5px rgba(0,0,0,0.2);

<script>
    // ========== TOGGLE SIDEBAR MOBILE ==========
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    const toggleBtn = document.getElementById('mobileMenuToggle');

    function closeMobileMenu() {
        if (window.innerWidth <= 768) {
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
        }
    }

    function openMobileMenu() {
        if (window.innerWidth <= 768) {
            sidebar.classList.add('open');
            overlay.classList.add('active');
        }
    }

    if (toggleBtn) {
        toggleBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            if (sidebar.classList.contains('open')) {
                closeMobileMenu();
            } else {
                openMobileMenu();
            }
        });
    }

    overlay.addEventListener('click', closeMobileMenu);

    window.addEventListener('resize', function() {
        if (window.innerWidth > 768) {
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
        }
    });

    // ========== CONFIG ==========
    const ADMIN_SECRET = "RuouchatAdmin2024!";
    const API_BASE = (() => {
        const path = window.location.pathname;
        if (path.includes('/admin/')) return '../api/';
        if (path.includes('/pages/')) return '../api/';
        return '/api/';
    })();

    let currentPage = 1;
    let totalPages = 1;
    let totalItems = 0;
    const perPage = 20;
    let isLoading = false;

    // ========== TOAST ==========
    function showToast(msg, type = 'success') {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = `toast-item ${type}`;
        const icon = type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle';
        toast.innerHTML = `<i class="fas ${icon}"></i> ${msg}`;
        container.appendChild(toast);
        
        requestAnimationFrame(() => {
            toast.classList.add('show');
        });
        
        setTimeout(() => {
            toast.classList.remove('show');
            setTimeout(() => toast.remove(), 400);
        }, 3000);
    }

    // ========== AUTH ==========
    async function checkAdminAndLoad() {
        try {
            const response = await fetch('/api/auth.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'check' }),
                credentials: 'include'
            });
            const data = await response.json();
            if (!data.logged_in || data.user?.role !== 'admin') {
                window.location.href = 'login.html';
                return false;
            }
            document.getElementById('loading-overlay').style.display = 'none';
            loadProducts();
            return true;
        } catch (error) {
            console.error('Lỗi kiểm tra đăng nhập:', error);
            window.location.href = 'login.html';
            return false;
        }
    }

    async function logout() {
        try {
            await fetch('/api/auth.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'logout' }),
                credentials: 'include'
            });
        } catch(e) { console.warn(e); }
        window.location.href = 'login.html';
    }

    document.getElementById('logoutBtn')?.addEventListener('click', (e) => {
        e.preventDefault();
        logout();
    });

    // ========== UTILITY ==========
    function escapeHtml(str) { 
        if (!str) return ''; 
        return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); 
    }
    
    function formatPrice(p) { 
        if (p === null || p === undefined || p === 0) {
            return '<span class="badge-contact"><i class="fas fa-phone me-1"></i>Liên hệ</span>';
        }
        return new Intl.NumberFormat('vi-VN').format(p) + 'đ'; 
    }

    function getStatusBadge(status) {
        if (status == 1) {
            return '<span class="badge-status badge-visible"><i class="fas fa-eye me-1"></i>Hiển thị</span>';
        } else {
            return '<span class="badge-status badge-hidden"><i class="fas fa-eye-slash me-1"></i>Ẩn</span>';
        }
    }

    function getCategoryBadge(category) {
        if (category === 'phat-tai') {
            return '<span class="badge-category badge-phat-tai">🍀 Phát Tài</span>';
        } else if (category === 'phat-loc') {
            return '<span class="badge-category badge-phat-loc">💰 Phát Lộc</span>';
        }
        return '<span class="badge-category">—</span>';
    }

    // ========== LOAD PRODUCTS ==========
    async function loadProducts(page = 1) {
        if (isLoading) return;
        isLoading = true;
        
        currentPage = page;
        const search = document.getElementById('searchInput').value.trim();
        const status = document.getElementById('statusFilter').value;
        const category = document.getElementById('categoryFilter').value;
        
        let url = `${API_BASE}admin_gift_products.php?limit=${perPage}&offset=${(page - 1) * perPage}`;
        if (search) url += `&search=${encodeURIComponent(search)}`;
        if (status !== '') url += `&status=${status}`;
        if (category) url += `&category=${encodeURIComponent(category)}`;
        
        try {
            const res = await fetch(url, { 
                headers: { 'X-Admin-Secret': ADMIN_SECRET },
                credentials: 'include'
            });
            const data = await res.json();
            
            if (data.success === false) {
                document.getElementById('giftList').innerHTML = `<div class="alert alert-danger m-3">❌ ${data.message || 'Lỗi tải dữ liệu'}</div>`;
                isLoading = false;
                return;
            }
            
            const products = data.products || [];
            totalItems = data.total || 0;
            totalPages = Math.ceil(totalItems / perPage) || 1;
            
            if (!products.length) {
                document.getElementById('giftList').innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-gift"></i>
                        <h5>Chưa có quà tặng nào</h5>
                        <p class="text-muted">Nhấn nút "Thêm quà tặng" để bắt đầu</p>
                        <button class="btn btn-primary mt-2" onclick="openForm()"><i class="fas fa-plus-circle me-2"></i>Thêm quà tặng</button>
                    </div>
                `;
                isLoading = false;
                return;
            }
            
            let html = `<div class="table-responsive"><table class="table align-middle"><thead><tr>
                <th style="width:40px;">ID</th>
                <th style="width:55px;">Hình</th>
                <th>Tên</th>
                <th style="width:110px;">Giá</th>
                <th style="width:100px;">Danh mục</th>
                <th style="width:70px;">ABV</th>
                <th style="width:100px;">Trạng thái</th>
                <th style="width:170px;">Thao tác</th>
            </tr></thead><tbody>`;
            
            products.forEach(p => {
                const imgSrc = p.main_image && p.main_image.startsWith('http') ? p.main_image : (p.main_image || 'https://placehold.co/70x70?text=Gift');
                const statusBadge = getStatusBadge(p.status);
                const categoryBadge = getCategoryBadge(p.category);
                const priceDisplay = formatPrice(p.price);
                
                html += `<tr>
                    <td class="fw-semibold">#${p.id}</td>
                    <td><img src="${imgSrc}" class="product-image" onerror="this.src='https://placehold.co/70x70?text=No+Img'"></td>
                    <td class="fw-semibold">${escapeHtml(p.name)}</td>
                    <td>${priceDisplay}</td>
                    <td>${categoryBadge}</td>
                    <td>${escapeHtml(p.abv || '—')}</td>
                    <td>${statusBadge}</td>
                    <td>
                        <div class="d-flex flex-wrap gap-1">
                            <button class="btn btn-sm btn-warning btn-action" onclick="editProduct(${p.id})" title="Sửa"><i class="fas fa-edit"></i></button>
                            <button class="btn btn-sm btn-info btn-action" onclick="previewProduct(${p.id})" title="Xem trước"><i class="fas fa-eye"></i></button>
                            <button class="btn btn-sm btn-success btn-action" onclick="cloneProduct(${p.id})" title="Nhân bản"><i class="fas fa-copy"></i></button>
                            <button class="btn btn-sm btn-danger btn-action" onclick="deleteProduct(${p.id})" title="Xóa"><i class="fas fa-trash-alt"></i></button>
                        </div>
                    </td>
                </tr>`;
            });
            
            html += `</tbody></table></div>`;
            
            if (totalPages > 1) {
                html += `<div class="pagination-wrapper">
                    <div class="info">Hiển thị ${(currentPage-1)*perPage+1} - ${Math.min(currentPage*perPage, totalItems)} / ${totalItems} sản phẩm</div>
                    <nav><ul class="pagination">`;
                
                if (currentPage > 1) {
                    html += `<li class="page-item"><a class="page-link" href="#" onclick="loadProducts(${currentPage-1});return false;"><i class="fas fa-chevron-left"></i></a></li>`;
                } else {
                    html += `<li class="page-item disabled"><span class="page-link"><i class="fas fa-chevron-left"></i></span></li>`;
                }
                
                let startPage = Math.max(1, currentPage - 2);
                let endPage = Math.min(totalPages, currentPage + 2);
                if (startPage > 1) {
                    html += `<li class="page-item"><a class="page-link" href="#" onclick="loadProducts(1);return false;">1</a></li>`;
                    if (startPage > 2) html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
                }
                for (let i = startPage; i <= endPage; i++) {
                    html += `<li class="page-item ${i === currentPage ? 'active' : ''}"><a class="page-link" href="#" onclick="loadProducts(${i});return false;">${i}</a></li>`;
                }
                if (endPage < totalPages) {
                    if (endPage < totalPages - 1) html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
                    html += `<li class="page-item"><a class="page-link" href="#" onclick="loadProducts(${totalPages});return false;">${totalPages}</a></li>`;
                }
                
                if (currentPage < totalPages) {
                    html += `<li class="page-item"><a class="page-link" href="#" onclick="loadProducts(${currentPage+1});return false;"><i class="fas fa-chevron-right"></i></a></li>`;
                } else {
                    html += `<li class="page-item disabled"><span class="page-link"><i class="fas fa-chevron-right"></i></span></li>`;
                }
                
                html += `</ul></nav></div>`;
            }
            
            document.getElementById('giftList').innerHTML = html;
        } catch (err) {
            console.error(err);
            document.getElementById('giftList').innerHTML = '<div class="alert alert-danger m-3">❌ Lỗi tải dữ liệu, vui lòng thử lại sau.</div>';
        } finally {
            isLoading = false;
        }
    }

    // ========== CRUD OPERATIONS ==========
    function openForm() {
        window.location.href = 'gift_form.html';
    }

    function editProduct(id) {
        window.location.href = `gift_form.html?id=${id}`;
    }

    function previewProduct(id) {
        window.open(`gift_form.html?preview=${id}`, '_blank');
    }

    async function deleteProduct(id) {
        if (!confirm('Bạn có chắc chắn muốn xóa sản phẩm này?')) return;
        try {
            const res = await fetch(`${API_BASE}admin_gift_products.php?id=${id}`, { 
                method: 'DELETE', 
                headers: { 'X-Admin-Secret': ADMIN_SECRET },
                credentials: 'include'
            });
            const data = await res.json();
            if (data.success) {
                showToast('✅ Xóa thành công', 'success');
                loadProducts(currentPage);
            } else {
                showToast('❌ Xóa thất bại: ' + (data.message || 'Không xác định'), 'error');
            }
        } catch (err) { 
            showToast('❌ Lỗi kết nối: ' + err.message, 'error');
        }
    }

    async function cloneProduct(id) {
        if (!confirm('Bạn có chắc chắn muốn nhân bản sản phẩm này?')) return;
        try {
            const res = await fetch(`${API_BASE}admin_gift_products.php?action=clone&id=${id}`, { 
                method: 'POST',
                headers: { 'X-Admin-Secret': ADMIN_SECRET },
                credentials: 'include'
            });
            const data = await res.json();
            if (data.success && data.new_id) {
                showToast('✅ Nhân bản thành công!', 'success');
                loadProducts(currentPage);
            } else {
                showToast('❌ Nhân bản thất bại: ' + (data.message || 'Không xác định'), 'error');
            }
        } catch (err) { 
            showToast('❌ Lỗi kết nối: ' + err.message, 'error');
        }
    }

    // ========== KEYBOARD SHORTCUTS ==========
    document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
            e.preventDefault();
            openForm();
        }
        if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
            e.preventDefault();
            document.getElementById('searchInput').focus();
        }
        if (e.key === 'Escape') {
            const search = document.getElementById('searchInput');
            if (document.activeElement === search) {
                search.value = '';
                loadProducts();
            }
        }
        if ((e.ctrlKey || e.metaKey) && e.key === 'r') {
            e.preventDefault();
            loadProducts(currentPage);
        }
    });

    // ========== AUTO REFRESH ==========
    let refreshInterval = setInterval(() => {
        if (!isLoading) {
            loadProducts(currentPage);
        }
    }, 60000);

    // ========== INIT ==========
    checkAdminAndLoad();

    window.addEventListener('beforeunload', () => {
        if (refreshInterval) {
            clearInterval(refreshInterval);
        }
    });
</script>
</body>
</html>
