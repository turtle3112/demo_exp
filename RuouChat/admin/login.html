<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Ruouchat Admin | Đăng nhập</title>
    <!-- Bootstrap 5 + Google Fonts Inter -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        /* Hiệu ứng nền trang trí */
        body::before {
            content: "";
            position: absolute;
            top: -20%;
            right: -10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(234, 179, 8, 0.15), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        body::after {
            content: "";
            position: absolute;
            bottom: -20%;
            left: -10%;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(234, 179, 8, 0.1), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .login-container {
            width: 100%;
            max-width: 460px;
            padding: 20px;
            z-index: 2;
        }

        .card {
            border: none;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(2px);
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.35);
            transition: transform 0.3s ease;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        .card-header {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            text-align: center;
            padding: 1.8rem 1.5rem;
            border-bottom: none;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            position: relative;
        }

        .card-header::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 20%;
            width: 60%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #facc15, transparent);
        }

        .card-header i {
            color: #facc15;
            margin-right: 10px;
        }

        .card-body {
            padding: 2rem 2rem 2.2rem;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #334155;
            margin-bottom: 0.4rem;
            letter-spacing: 0.3px;
        }

        .form-control {
            border-radius: 28px;
            border: 1px solid #e2e8f0;
            padding: 0.75rem 1.2rem;
            font-size: 0.9rem;
            transition: all 0.2s;
            background-color: #ffffff;
        }

        .form-control:focus {
            border-color: #facc15;
            box-shadow: 0 0 0 4px rgba(250, 204, 21, 0.2);
            outline: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            border: none;
            padding: 0.8rem;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 0.5px;
            transition: all 0.2s;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.15);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #1e293b, #0f172a);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .alert-danger {
            border-radius: 50px;
            background: #fee2e2;
            color: #b91c1c;
            border: none;
            font-size: 0.8rem;
            font-weight: 500;
            text-align: center;
            padding: 0.7rem;
            margin-bottom: 1.5rem;
        }

        /* Responsive */
        @media (max-width: 576px) {
            .login-container {
                padding: 15px;
            }
            .card-header {
                font-size: 1.4rem;
                padding: 1.3rem 1rem;
            }
            .card-body {
                padding: 1.5rem;
            }
            .btn-primary {
                padding: 0.7rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="card">
            <div class="card-header">
                <i class="fas fa-crown"></i> Ruouchat Admin
            </div>
            <div class="card-body">
                <div id="errorMsg" class="alert alert-danger" style="display:none"></div>
                <form id="loginForm">
                    <div class="mb-4">
                        <label class="form-label">Tên đăng nhập hoặc Email</label>
                        <input type="text" id="username" class="form-control" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Mật khẩu</label>
                        <input type="password" id="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fas fa-sign-in-alt me-2"></i> Đăng nhập
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Font Awesome (chưa có, thêm để hiển thị icon) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        const loginForm = document.getElementById('loginForm');
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const response = await fetch('../api/auth.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'login', username, password })
            });
            const data = await response.json();
            if (data.success && data.user.role === 'admin') {
                localStorage.setItem('admin', JSON.stringify(data.user));
                window.location.href = 'index.html';
            } else {
                document.getElementById('errorMsg').innerText = 'Sai tên đăng nhập hoặc không có quyền admin';
                document.getElementById('errorMsg').style.display = 'block';
            }
        });
    </script>
</body>
</html>
