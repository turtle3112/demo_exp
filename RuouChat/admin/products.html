<script>
    // ========== TOGGLE SIDEBAR MOBILE ==========
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    const toggleBtn = document.getElementById('mobileMenuToggle');

    function closeMobileMenu() {
        if (window.innerWidth <= 768) {
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
        }
    }

    function openMobileMenu() {
        if (window.innerWidth <= 768) {
            sidebar.classList.add('open');
            overlay.classList.add('active');
        }
    }

    if (toggleBtn) {
        toggleBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            if (sidebar.classList.contains('open')) {
                closeMobileMenu();
            } else {
                openMobileMenu();
            }
        });
    }

    overlay.addEventListener('click', closeMobileMenu);

    window.addEventListener('resize', function() {
        if (window.innerWidth > 768) {

    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[m])); }
    
    function formatPrice(price) {
        if (price === null || price === undefined || price === 0 || price === '') {
            return '<span class="badge-contact"><i class="fas fa-phone me-1"></i>Liên hệ</span>';
        }
        return new Intl.NumberFormat('vi-VN').format(price) + 'đ';
    }
    
    function formatPriceText(price) {
        if (price === null || price === undefined || price === 0 || price === '') {
            return 'Liên hệ';
        }
        return new Intl.NumberFormat('vi-VN').format(price) + 'đ';
    }
    
    function showToast(message, type = 'success') {
        const toast = document.createElement('div');
        toast.className = 'toast-notification';
        if (type === 'error') toast.classList.add('error');
        if (type === 'warning') toast.classList.add('warning');
        toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'} me-2"></i>${message}`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }
    function showToastSuccess(msg) { showToast(msg, 'success'); }
    function showToastError(msg) { showToast(msg, 'error'); }
    function showToastWarning(msg) { showToast(msg, 'warning'); }

    async function updateProductField(productId, updates) {
        if (updatingProductIds.has(productId)) { showToastWarning("Đang cập nhật..."); return false; }
        updatingProductIds.add(productId);
        try {
            const fetchRes = await fetch(`../api/admin_products.php?id=${productId}`);
            if (!fetchRes.ok) throw new Error("Không thể lấy sản phẩm");
            const product = await fetchRes.json();
            const payload = { ...product, ...updates };
            const putRes = await fetch('../api/admin_products.php', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            const result = await putRes.json();
            if (result.success) { showToastSuccess("Cập nhật thành công!"); await loadProductsWithFilters(); return true; } 
            else { showToastError("Lỗi: " + (result.message || "Không thể cập nhật")); return false; }
        } catch (err) { showToastError("Lỗi kết nối: " + err.message); return false; } 
        finally { updatingProductIds.delete(productId); }
    }

    async function updateStockInline(productId, inputElement) {
        let newStock = parseInt(inputElement.value);
        if (isNaN(newStock)) newStock = 0;
        if (newStock < 0) newStock = 0;
        inputElement.value = newStock;
        const originalValue = inputElement.getAttribute("data-original-stock");
        if (originalValue !== null && parseInt(originalValue) === newStock) return;
        const parentTd = inputElement.closest('td');
        const originalContent = parentTd.innerHTML;
        parentTd.innerHTML = `<div class="d-flex"><span class="saving-spinner me-1"></span><span class="text-muted">Đang lưu...</span></div>`;
        const success = await updateProductField(productId, { stock_quantity: newStock });
        if (!success) parentTd.innerHTML = originalContent;
    }

    async function updateStatusInline(productId, selectElement) {
        const newStatus = selectElement.value;
        const originalStatus = selectElement.getAttribute("data-original-status");
        if (originalStatus === newStatus) return;
        const parentTd = selectElement.closest('td');
        const originalHtml = parentTd.innerHTML;
        parentTd.innerHTML = `<div class="d-flex"><span class="saving-spinner me-1"></span><span class="text-muted">Đang cập nhật...</span></div>`;
        const success = await updateProductField(productId, { display_status: newStatus });
        if (!success) parentTd.innerHTML = originalHtml;
    }

    async function loadProductsWithFilters() {
        showLoading(true);
        const grapeType = document.getElementById('filterGrapeType').value;
        const country = document.getElementById('filterCountry').value;
        const producerId = document.getElementById('filterProducer').value;
        const categoryId = document.getElementById('filterCategory').value;
        const parentCategoryId = document.getElementById('filterParentCategory').value;
        const tag = document.getElementById('filterTag').value.trim();
        const minPrice = document.getElementById('filterMinPrice').value;
        const maxPrice = document.getElementById('filterMaxPrice').value;
        const displayStatus = document.getElementById('filterDisplayStatus').value;
        const stockStatus = document.getElementById('filterStockStatus').value;
        const searchName = document.getElementById('quickSearch').value.trim();
        const sortValue = document.getElementById('sortSelect').value;
        let url = '../api/admin_products.php?limit=100';
        if (grapeType) url += `&grape_type=${encodeURIComponent(grapeType)}`;
        if (country) url += `&country=${encodeURIComponent(country)}`;
        if (producerId) url += `&producer_id=${producerId}`;
        if (categoryId) url += `&category_id=${categoryId}`;
        if (parentCategoryId) url += `&parent_category_id=${parentCategoryId}`;
        if (tag) url += `&tag=${encodeURIComponent(tag)}`;
        if (minPrice) url += `&min_price=${minPrice}`;
        if (maxPrice) url += `&max_price=${maxPrice}`;
        if (stockStatus) url += `&stock_status=${stockStatus}`;
        if (searchName) url += `&search=${encodeURIComponent(searchName)}`;
        if (displayStatus) url += `&display_status=${displayStatus}`;
        if (sortValue) url += `&sort=${sortValue}`;
        try {
            const res = await fetch(url);
            const data = await res.json();
            const products = data.products || [];
            const grapes = [...new Set(products.map(p => p.grape_type).filter(v=>v))].sort();
            const countries = [...new Set(products.map(p => p.country).filter(v=>v))].sort();
            document.getElementById('filterGrapeType').innerHTML = '<option value="">Tất cả</option>' + grapes.map(g=>`<option value="${escapeHtml(g)}">${escapeHtml(g)}</option>`).join('');
            document.getElementById('filterCountry').innerHTML = '<option value="">Tất cả</option>' + countries.map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
            renderProductTable(products);
        } catch(err) { document.getElementById('productList').innerHTML = '<div class="alert alert-danger m-3">Lỗi tải dữ liệu: ' + err.message + '</div>'; }
        showLoading(false);
    }

    /**
     * Tạo slug từ tên sản phẩm (dùng khi API không trả về slug)
     */
    function generateSlug(name) {
        if (!name) return '';
        // Chuyển sang chữ thường
        let slug = name.toLowerCase();
        // Chuyển đổi các ký tự có dấu sang không dấu
        const from = 'àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ';
        const to   = 'aaaaaaaaaaaaaaaaaeeeeeeeeeeeiiiiiooooooooooooooooouuuuuuuuuuuyyyyyd';
        for (let i = 0; i < from.length; i++) {
            slug = slug.replace(new RegExp(from[i], 'g'), to[i]);
        }
        // Thay thế khoảng trắng và ký tự đặc biệt bằng dấu gạch ngang
        slug = slug.replace(/[^a-z0-9]+/g, '-');
        // Xóa dấu gạch ngang ở đầu và cuối
        slug = slug.replace(/^-+|-+$/g, '');
        return slug;
    }

    /**
     * Lấy danh sách danh mục cha của sản phẩm
     * Hỗ trợ nhiều cấu trúc dữ liệu khác nhau
     */
    function getParentCategories(product) {
        const parentSet = new Set();
        
        // Cách 1: Dùng categories array (có cấu trúc đầy đủ)
        if (product.categories && Array.isArray(product.categories)) {
            product.categories.forEach(cat => {
                // Nếu category có parent_id
                if (cat.parent_id && cat.parent_id > 0) {
                    parentSet.add(cat.parent_id);
                }
                // Nếu category không có parent_id nhưng có thể là parent
                if (!cat.parent_id || cat.parent_id === 0) {
                    parentSet.add(cat.id);
                }
            });
        }
        
        // Cách 2: Dùng category_ids (danh sách ID)
        if (product.category_ids && Array.isArray(product.category_ids)) {
            product.category_ids.forEach(catId => {
                const cat = categoryList.find(c => c.id === catId);
                if (cat) {
                    if (cat.parent_id && cat.parent_id > 0) {
                        parentSet.add(cat.parent_id);
                    } else {
                        parentSet.add(cat.id);
                    }
                }
            });
        }
        
        // Cách 3: Dùng category_parent_id (lưu trực tiếp)
        if (product.category_parent_id && product.category_parent_id > 0) {
            parentSet.add(product.category_parent_id);
        }
        
        // Cách 4: Dùng parent_category_id (lưu trực tiếp)
        if (product.parent_category_id && product.parent_category_id > 0) {
            parentSet.add(product.parent_category_id);
        }
        
        return Array.from(parentSet);
    }

    /**
     * Lấy tên và class cho danh mục cha
     */
    function getParentCategoryInfo(parentId) {
        const cat = categoryList.find(c => c.id === parentId);
        if (cat) {
            const colorClass = parentCategoryColorMap[parentId] || 'default';
            return {
                name: cat.name,
                colorClass: colorClass
            };
        }
        return null;
    }

    function renderProductTable(products) {
        if (!products.length) { document.getElementById('productList').innerHTML = '<div class="text-center p-4 text-muted">Không có sản phẩm nào</div>'; return; }
        
        // Tạo map category để tra cứu nhanh
        const categoryMap = {};
        categoryList.forEach(cat => {
            categoryMap[cat.id] = cat;
        });

        let html = `<div class="table-responsive"><table class="table align-middle"><thead><tr>
            <th style="width:32px"><input type="checkbox" id="selectAllCheckbox"></th>
            <th style="width:40px">ID</th>
            <th style="width:55px">Hình</th>
            <th>Tên</th>
            <th style="width:100px">Giá</th>
            <th style="min-width:150px">Danh mục cha</th>
            <th>Nhà sản xuất</th>
            <th>Danh mục</th>
            <th style="width:80px" class="text-center">📦 Tồn kho</th>
            <th style="width:40px" class="text-center">Vận chuyển</th>
            <th style="width:40px" class="text-center">Tự động</th>
            <th style="width:120px">📌 Trạng thái</th>
            <th style="min-width:140px">Thao tác</th>
        </tr></thead><tbody>`;

        for (let p of products) {
            const imgSrc = p.main_image && (p.main_image.startsWith('http') || p.main_image.startsWith('/')) ? p.main_image : 'https://placehold.co/60x60?text=No+Image';
            const categoryName = p.category_name || (categoryMap[p.category_id]?.name) || '—';
            const supplierName = p.supplier_name || (producersList.find(s => s.id == p.producer_id)?.name) || '—';
            const shipIcon = p.requires_special_shipping ? '<i class="fas fa-truck-ramp-box text-danger" title="Vận chuyển đặc biệt"></i>' : '<i class="fas fa-check-circle text-success" title="Vận chuyển thường"></i>';
            const autoIcon = p.auto_status_update ? '<i class="fas fa-toggle-on text-success" title="Tự động chuyển khi hết hàng"></i>' : '<i class="fas fa-toggle-off text-secondary" title="Không tự động"></i>';
            
            let statusDropdown = `<select class="status-select" data-product-id="${p.id}" data-original-status="${p.display_status || 'visible'}">`;
            const statusOptions = ['visible','hidden','coming_soon','discontinued','draft'];
            const statusLabels = { visible:'Hiển thị', hidden:'Ẩn', coming_soon:'Sắp về', discontinued:'Ngừng KD', draft:'Nháp' };
            statusOptions.forEach(opt => { statusDropdown += `<option value="${opt}" ${p.display_status === opt ? 'selected' : ''}>${statusLabels[opt]}</option>`; });
            statusDropdown += `</select>`;
            
            const productNameHtml = `<a href="javascript:void(0);" class="product-name-link" onclick="handleProductNameClick(${p.id})">${escapeHtml(p.name)}</a>`;
            const rowClass = p.display_status === 'draft' ? 'table-draft' : '';
            const priceDisplay = formatPrice(p.price);
            
            // ==== LẤY SLUG CHO SẢN PHẨM ====
            // Ưu tiên dùng slug từ API, nếu không có thì tự generate từ tên
            let productSlug = p.slug || generateSlug(p.name);
            
            // ==== LẤY DANH MỤC CHA CỦA SẢN PHẨM ====
            const parentIds = getParentCategories(p);
            let parentDisplay = '';
            
            if (parentIds.length > 0) {
                // Lọc các parent ID trùng lặp và lấy thông tin
                const uniqueParentIds = [...new Set(parentIds)];
                const parentInfoList = uniqueParentIds
                    .map(id => getParentCategoryInfo(id))
                    .filter(info => info !== null);
                
                if (parentInfoList.length > 0) {
                    parentDisplay = parentInfoList.map(info => 
                        `<span class="parent-category-badge ${info.colorClass}"><i class="fas fa-folder-open"></i>${escapeHtml(info.name)}</span>`
                    ).join(' ');
                } else {
                    parentDisplay = '<span class="text-muted">—</span>';
                }
            } else {
                parentDisplay = '<span class="text-muted">—</span>';
            }
            
            html += `<tr class="${rowClass}">
                <td><input type="checkbox" class="product-checkbox" value="${p.id}"></td>
                <td>${p.id}</td>
                <td><img src="${imgSrc}" class="product-image" onerror="this.src='https://placehold.co/60x60?text=No+Image'"></td>
                <td>${productNameHtml}</td>
                <td class="fw-bold">${priceDisplay}</td>
                <td>${parentDisplay}</td>
                <td>${escapeHtml(supplierName)}</td>
                <td>${escapeHtml(categoryName)}</td>
                <td class="text-center"><input type="number" class="inline-stock-input" value="${p.stock_quantity || 0}" data-product-id="${p.id}" data-original-stock="${p.stock_quantity || 0}" step="1" min="0"></td>
                <td class="text-center">${shipIcon}</td>
                <td class="text-center">${autoIcon}</td>
                <td class="text-center">${statusDropdown}</td>
                <td>
                    <button class="btn btn-sm btn-info btn-preview me-1" onclick="previewProduct('${productSlug}')" title="Xem trước">
                        <i class="fas fa-eye"></i>
                    </button>
                    <button class="btn btn-sm btn-warning me-1" onclick="editProduct(${p.id})" title="Sửa">
                        <i class="fas fa-edit"></i>
                    </button>
                    <button class="btn btn-sm btn-danger" onclick="deleteProduct(${p.id})" title="Xóa">
                        <i class="fas fa-trash"></i>
                    </button>
                </td>
            </tr>`;
        }
        html += `</tbody></table></div>`;
        document.getElementById('productList').innerHTML = html;
        
        // Gắn sự kiện cho các input stock và select status
        document.querySelectorAll('.inline-stock-input').forEach(input => { 
            const pid = parseInt(input.dataset.productId); 
            input.addEventListener('blur', () => updateStockInline(pid, input)); 
            input.addEventListener('keypress', e => { if(e.key === 'Enter') input.blur(); }); 
        });
        document.querySelectorAll('.status-select').forEach(select => { 
            const pid = parseInt(select.dataset.productId); 
            select.addEventListener('change', () => updateStatusInline(pid, select)); 
        });
        attachCheckboxEvents();
    }

    function attachCheckboxEvents() {
        const checkboxes = document.querySelectorAll('.product-checkbox');
        const selectAll = document.getElementById('selectAllCheckbox');
        if (selectAll) selectAll.onchange = (e) => { checkboxes.forEach(cb => cb.checked = e.target.checked); updateSelected(); };
        checkboxes.forEach(cb => cb.onchange = updateSelected);
        updateSelected();
    }
    
    function updateSelected() {
        selectedProducts.clear();
        document.querySelectorAll('.product-checkbox:checked').forEach(cb => selectedProducts.add(parseInt(cb.value)));
        const count = selectedProducts.size;
        document.getElementById('selectedCount').innerText = count + ' sản phẩm được chọn';
        document.getElementById('bulkToolbar').classList.toggle('show', count > 0);
    }

    document.getElementById('bulkActionSelect').onchange = function() {
        const val = this.value;
        document.getElementById('bulkStatusInput').style.display = val === 'change_status' ? 'inline-block' : 'none';
        document.getElementById('bulkPriceInput').style.display = val === 'change_price' ? 'inline-block' : 'none';
        document.getElementById('bulkCategoryInput').style.display = (val === 'add_categories' || val === 'remove_categories') ? 'inline-block' : 'none';
        document.getElementById('bulkSupplierInput').style.display = val === 'change_supplier' ? 'inline-block' : 'none';
    };
    
    document.getElementById('applyBulkAction').onclick = async () => {
        const action = document.getElementById('bulkActionSelect').value;
        if (!action || selectedProducts.size === 0) { showToastWarning('Vui lòng chọn hành động và sản phẩm'); return; }
        const ids = Array.from(selectedProducts);
        let body = { ids, bulk_action: action };
        if (action === 'change_status') { const newStatus = document.getElementById('bulkStatus').value; if (!newStatus) return showToastWarning('Chọn trạng thái'); body.new_status = newStatus; }
        else if (action === 'change_price') { const price = document.getElementById('bulkPrice').value; if(price === '') return showToastWarning('Nhập giá'); body.new_price = parseFloat(price) || null; }
        else if (action === 'add_categories' || action === 'remove_categories') { const catId = document.getElementById('bulkCategory').value; if(!catId) return showToastWarning('Chọn danh mục'); body.category_ids = [parseInt(catId)]; }
        else if (action === 'change_supplier') { const supplierId = document.getElementById('bulkSupplier').value; if(!supplierId) return showToastWarning('Chọn nhà sản xuất'); body.supplier_id = parseInt(supplierId); }
        else if (action === 'delete') { if (!confirm(`Bạn có chắc chắn muốn xóa ${ids.length} sản phẩm đã chọn?`)) return; }
        showLoading(true);
        try {
            const res = await fetch('../api/admin_products.php?action=bulk', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
            const data = await res.json();
            if (data.success) { showToastSuccess('Thực hiện hàng loạt thành công!'); await loadProductsWithFilters(); document.querySelectorAll('.product-checkbox').forEach(cb => cb.checked = false); updateSelected(); } 
            else { showToastError('Lỗi: ' + (data.message || 'Không xác định')); }
        } catch(err) { showToastError('Lỗi kết nối: ' + err.message); }
        showLoading(false);
    };
    
    document.getElementById('clearSelection').onclick = () => { document.querySelectorAll('.product-checkbox').forEach(cb => cb.checked = false); updateSelected(); };
    
    async function init() { await loadSelectOptions(); await loadProductsWithFilters(); }
    document.getElementById('logoutBtn').addEventListener('click', (e) => { e.preventDefault(); logout(); });
    checkAdminAndLoad();
</script>
</body>
</html>
